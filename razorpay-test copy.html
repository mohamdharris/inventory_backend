<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Razorpay Test Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  h2 { font-size: 14px; margin-top: 28px; border-top: 1px solid #ddd; padding-top: 16px; }
  label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: #444; }
  input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; padding: 10px 18px; background: #3399cc; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2b7ba3; }
  button.secondary { background: #666; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 20px; }
  .note { font-size: 12px; color: #777; margin-top: 6px; }
  .status { font-size: 13px; font-weight: 600; margin-top: 10px; }
  .ok { color: #2a8a2a; }
  .err { color: #c0392b; }
</style>
</head>
<body>
  <h1>Razorpay Test Checkout</h1>
  <p class="note">Signs in, creates the order, opens Razorpay Test Mode checkout, and auto-verifies the payment — all in one click. Nothing needs to be copy-pasted into Postman.</p>

  <label>API base URL</label>
  <input id="baseUrl" value="http://localhost:3000">

  <h2>1. Sign in</h2>
  <label>Login name</label>
  <input id="loginName" placeholder="e.g. admin">
  <label>Password</label>
  <input id="loginPassword" type="password" placeholder="password">
  <button onclick="doSignIn()">Sign In</button>
  <div id="signinStatus" class="status"></div>

  <h2>2. Pay</h2>
  <label>Amount (INR)</label>
  <input id="amount" value="1500">
  <label>Items (optional description)</label>
  <input id="items" value="5x Groovy Shorts">
  <button onclick="startPayment()">Create Order &amp; Pay</button>

  <pre id="output">Sign in first, then click "Create Order & Pay".</pre>

  <script>
    let authToken = '';

    async function doSignIn() {
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const name = document.getElementById('loginName').value.trim();
      const password = document.getElementById('loginPassword').value;
      const statusEl = document.getElementById('signinStatus');
      statusEl.textContent = 'Signing in...';
      statusEl.className = 'status';

      try {
        const res = await fetch(`${baseUrl}/api/auth/signin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password }),
        });
        const data = await res.json();

        if (data.errorCode === 0 && data.authToken) {
          authToken = data.authToken;
          statusEl.textContent = `Signed in as ${data.userName} (${data.role}). Token stored — ready to pay.`;
          statusEl.className = 'status ok';
        } else {
          statusEl.textContent = 'Sign in failed: ' + (data.msg || 'unknown error');
          statusEl.className = 'status err';
        }
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'status err';
      }
    }

    async function startPayment() {
      const output = document.getElementById('output');
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const items = document.getElementById('items').value.trim();

      if (!authToken) {
        output.textContent = 'Please sign in first (step 1) before creating an order.';
        return;
      }

      output.textContent = 'Creating order...';

      try {
        const createRes = await fetch(`${baseUrl}/api/payments/create-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'authToken': authToken },
          body: JSON.stringify({ amount: Number(amount), items }),
        });
        const createData = await createRes.json();

        if (createData.errorCode !== 0) {
          output.textContent = 'Create order failed:\n' + JSON.stringify(createData, null, 2);
          return;
        }

        output.textContent = 'Order created. Opening checkout...';

        const options = {
          key: createData.data.keyId,
          amount: createData.data.amount,
          currency: createData.data.currency,
          name: 'Products API - Test Payment',
          description: items || 'Test payment',
          order_id: createData.data.razorpayOrderId,
          handler: async function (response) {
            output.textContent = 'Payment done. Verifying with your API...';

            try {
              const verifyRes = await fetch(`${baseUrl}/api/payments/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'authToken': authToken },
                body: JSON.stringify({
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_signature: response.razorpay_signature,
                }),
              });
              const verifyData = await verifyRes.json();
              output.textContent =
                (verifyData.errorCode === 0 ? '✅ ' : '❌ ') +
                JSON.stringify(verifyData, null, 2);
            } catch (verifyErr) {
              output.textContent = 'Verify call failed: ' + verifyErr.message;
            }
          },
          modal: {
            ondismiss: function () {
              output.textContent += '\n\nCheckout was closed before completing payment.';
            },
          },
          theme: { color: '#3399cc' },
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          output.textContent = 'Payment failed:\n' + JSON.stringify(response.error, null, 2);
        });
        rzp.open();
      } catch (err) {
        output.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
