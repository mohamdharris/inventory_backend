<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Razorpay Test Checkout</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; color: #444; }
  input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; padding: 10px 18px; background: #3399cc; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2b7ba3; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-all; margin-top: 20px; }
  .note { font-size: 12px; color: #777; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Razorpay Test Checkout</h1>
  <p class="note">This is a local dev tool to test the payment flow end-to-end. It calls your API's <code>/create-order</code>, opens Razorpay's real Test Mode checkout, then shows you the payment_id/signature so you can call <code>/verify</code>.</p>

  <label>API base URL</label>
  <input id="baseUrl" value="http://localhost:3000">

  <label>authToken (from /api/auth/signin)</label>
  <input id="authToken" placeholder="paste your token here">

  <label>Amount (INR)</label>
  <input id="amount" value="1500">

  <label>Items (optional description)</label>
  <input id="items" value="5x Groovy Shorts">

  <button onclick="startPayment()">Create Order &amp; Pay</button>

  <pre id="output"></pre>

  <script>
    async function startPayment() {
      const output = document.getElementById('output');
      const baseUrl = document.getElementById('baseUrl').value.trim();
      const authToken = document.getElementById('authToken').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const items = document.getElementById('items').value.trim();

      output.textContent = 'Creating order...';

      try {
        const createRes = await fetch(`${baseUrl}/api/payments/create-order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'authToken': authToken },
          body: JSON.stringify({ amount: Number(amount), items }),
        });
        const createData = await createRes.json();

        if (createData.errorCode !== 0) {
          output.textContent = 'Create order failed:\n' + JSON.stringify(createData, null, 2);
          return;
        }

        output.textContent = 'Order created. Opening checkout...\n' + JSON.stringify(createData.data, null, 2);

        const options = {
          key: createData.data.keyId,
          amount: createData.data.amount,
          currency: createData.data.currency,
          name: 'Products API - Test Payment',
          description: items || 'Test payment',
          order_id: createData.data.razorpayOrderId,
          handler: function (response) {
            output.textContent =
              'Payment completed. Use this body for POST /api/payments/verify:\n\n' +
              JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature,
              }, null, 2);
          },
          modal: {
            ondismiss: function () {
              output.textContent += '\n\nCheckout was closed before completing payment.';
            },
          },
          theme: { color: '#3399cc' },
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          output.textContent = 'Payment failed:\n' + JSON.stringify(response.error, null, 2);
        });
        rzp.open();
      } catch (err) {
        output.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
